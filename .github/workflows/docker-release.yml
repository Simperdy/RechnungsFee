# RechnungsFee Server-Image: Build + Tests bei Release-Tag
#
# Läuft bei Push eines Tags v* (z. B. v1.0.0). Baut das multistage Docker-Image,
# pusht es nach GHCR als ghcr.io/<owner>/rechnungsfee-server:<tag> und :latest.
# Backend-Tests (pytest), Frontend-Tests (vitest + tsc + build) und
# Sicherheits-Audits (pip-audit, npm audit) müssen vorher grün sein.
#
# WICHTIG: Dieses Workflow-File kann nur mit einem Token gepusht werden, der den
# `workflow`-Scope hat (gh auth refresh -s workflow) — Agent-Tokens ohne diesen
# Scope werden von GitHub abgelehnt.

name: docker-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rechnungsfee-server

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + test deps
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: src/backend
        run: python -m pytest tests -q
      - name: pip-audit
        working-directory: src/backend
        run: pip install pip-audit && pip-audit -r requirements.txt

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install + test + typecheck + build
        working-directory: src/frontend
        run: |
          npm ci
          npm test
          npx tsc -b --pretty false
          npm run build
      - name: npm audit (high+)
        working-directory: src/frontend
        run: npm audit --audit-level=high

  docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value={{tag}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
